name: CI Build

# 同时监听 main 和 master 分支的推送和 PR
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. 拉取源代码
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. 设置 Java 环境（该项目通常需要 JDK 17 或 21，这里以 17 为例）
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    # 3. 赋予 Gradle 脚本执行权限
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. 执行编译构建
    - name: Build with Gradle
      run: ./gradlew build

    # 5. 上传构建产物（重点：直接在 GitHub 提供下载）
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CrewX-Build-Jar
        # 针对你的要求，合并并指定精准的构建产物输出路径
        path: build/libs/*.jar
